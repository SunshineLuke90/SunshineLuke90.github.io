<!DOCTYPE html>
<head>
    <meta property="og:title" content="Blog">
    <meta property="og:image" content="images/KC1440p.jpg">
    <!--Instructions to get favicon for various webpages and types.-->
    <link rel="icon" type="image/png" href="/images/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg" />
    <link rel="shortcut icon" href="/images/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="MyWebSite" />
    <link rel="manifest" href="/images/site.webmanifest" />

    <!--Import Calcite Stylesheet via CDN. This is easier than having to create react stuff for each static page-->
    <script type="module" src="https://js.arcgis.com/calcite-components/3.2.1/calcite.esm.js"></script>

    <!--Import Noto Sans so that the website draws properly-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wdth,wght@0,62.5..100,100..900;1,62.5..100,100..900&display=swap"
        rel="stylesheet">

    <!--Reference component stylesheet-->
    <link rel="stylesheet" href="calcite.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="./blog/blog.css">
    <script type="module" src="./blog/main.jsx"></script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!--Webpage Title-->
    <title>Lucius Creamers Portfolio</title>
</head>

<body>
    <div class="header noto-sans-heavy">
        <img src="images/KC1440p.jpg" alt="A styled topographic map background" />
        <h1>Sunshine Spatial</h1>
        <h2>GIS and Developer Portfolio | Lucius Creamer</h2>
        <h3>A showcase of passion projects, coding exercises, and design work.</h3>
        <div class="action-bar">
            <calcite-button href="index.html" class="menu-button" round="true" kind="neutral" label="Open home Page"
                icon-start="home" scale="m" appearance="transparent" title="Home"></calcite-button>
            <calcite-button href="about.html" class="menu-button" round="true" kind="neutral" label="Open about me"
                icon-start="information" scale="m" appearance="transparent" title="About me"></calcite-button>
            <calcite-button href="blog.html" class="menu-button" round="true" kind="neutral" label="Open blog"
                icon-start="blog" scale="m" appearance="transparent" title="Blog"></calcite-button>
            <calcite-button href="contact.html" class="menu-button" round="true" kind="neutral"
                label="Open contact information" icon-start="address-book" scale="m" appearance="transparent"
                title="Contact"></calcite-button>
        </div>
    </div>
    <main>
        <h2 class="sub-header">Blog</h2>
        <div id="blog-root"></div>
    </main>
    <footer>
        <p>&copy; 2026 Lucius Creamer. All rights reserved.</p>
    </footer>
</body>
